name: firedrake-verify-0

on:
  workflow_dispatch:
  push:
    branches: [refactor/evidence-integrity]
    paths:
      - "tests/verify_0_spaces.py"
      - "BURGAMOTS_NUMERICS_v1.md"
      - ".github/workflows/m0-firedrake.yml"

jobs:
  verify-0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run VERIFY-0 in pinned Firedrake + Gusto environment
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            firedrakeproject/firedrake:2026.4.1@sha256:798066ee679c94cb379021a0a65099b218702f819d3b0c41f703de16f039e98c \
            bash -lc '
              set -euo pipefail
              python3 --version
              python3 -m pip install \
                "git+https://github.com/firedrakeproject/gusto.git@669f6372cd334ed47c9c7b38f26e591732273f75"
              python3 - <<'"'"'PY'"'"'
from importlib.metadata import distribution
from pathlib import Path

dist = distribution("gusto")
direct = Path(dist._path) / "direct_url.json"
print("Pinned Gusto direct_url.json:")
print(direct.read_text())
PY
              python3 /work/tests/verify_0_spaces.py
            '
