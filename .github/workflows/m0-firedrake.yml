name: firedrake-m0-crucible

on:
  workflow_dispatch:
  push:
    branches: [refactor/evidence-integrity]
    paths:
      - "numerics/firedrake/**"
      - "BURGAMOTS_NUMERICAL_REALIZATION_SPEC_v1.md"
      - ".github/workflows/m0-firedrake.yml"

jobs:
  semidiscrete-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run semidiscrete M0 crucible in pinned Firedrake container
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/work"             -w /work             firedrakeproject/firedrake:2026.4.1@sha256:798066ee679c94cb379021a0a65099b218702f819d3b0c41f703de16f039e98c             python numerics/firedrake/m0_semidiscrete.py
