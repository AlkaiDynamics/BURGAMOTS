name: engineering-synthetic-work-law

on:
  push:
    branches:
      - eng/synthetic-work-law
    paths:
      - "engineering/synthetic_work/synthetic_work_identity.py"
      - "engineering/synthetic_work/paired_run_contract.py"
      - ".github/workflows/engineering-synthetic-work-law.yml"
  workflow_dispatch:

jobs:
  synthetic-work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run analytic synthetic work-law harness
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            firedrakeproject/firedrake:2026.4.1@sha256:798066ee679c94cb379021a0a65099b218702f819d3b0c41f703de16f039e98c \
            bash -lc '
              set -euo pipefail
              python3 -m pip install \
                "git+https://github.com/firedrakeproject/gusto.git@669f6372cd334ed47c9c7b38f26e591732273f75"
              python3 /work/engineering/synthetic_work/synthetic_work_identity.py
              python3 /work/engineering/synthetic_work/paired_run_contract.py
            '
