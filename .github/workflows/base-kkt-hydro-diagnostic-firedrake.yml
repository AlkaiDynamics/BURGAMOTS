name: firedrake-base-kkt-hydro-diagnostic-probe

on:
  push:
    branches:
      - refactor/evidence-integrity
    paths:
      - "tests/diagnose_base_kkt_0_hydro.py"
      - ".github/workflows/base-kkt-hydro-diagnostic-firedrake.yml"
  pull_request:
    paths:
      - "tests/diagnose_base_kkt_0_hydro.py"
      - ".github/workflows/base-kkt-hydro-diagnostic-firedrake.yml"
  workflow_dispatch:

jobs:
  base-kkt-hydro-diagnostic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run focused BASE-KKT-0 hydro diagnostic probe in pinned Firedrake + Gusto environment
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            firedrakeproject/firedrake:2026.4.1@sha256:798066ee679c94cb379021a0a65099b218702f819d3b0c41f703de16f039e98c \
            bash -lc '
              set -euo pipefail
              python3 --version
              python3 -m pip install \
                "git+https://github.com/firedrakeproject/gusto.git@669f6372cd334ed47c9c7b38f26e591732273f75"
              python3 /work/tests/diagnose_base_kkt_0_hydro.py
            '
