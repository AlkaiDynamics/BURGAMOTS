name: engineering-discrete-gradient-full-step

on:
  push:
    branches:
      - eng/discrete-gradient-timestepper
    paths:
      - "engineering/timestepper/manufactured_discrete_gradient.py"
      - "engineering/timestepper/full_unforced_step.py"
      - "numerics/coefficient_centering.py"
      - ".github/workflows/engineering-discrete-gradient.yml"
  workflow_dispatch:

jobs:
  full-dg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run A1 discrete-gradient kernel and full nonlinear step
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            firedrakeproject/firedrake:2026.4.1@sha256:798066ee679c94cb379021a0a65099b218702f819d3b0c41f703de16f039e98c \
            bash -lc '
              set -euo pipefail
              python3 -m pip install \
                "git+https://github.com/firedrakeproject/gusto.git@669f6372cd334ed47c9c7b38f26e591732273f75"
              PYTHONPATH=/work python3 /work/engineering/timestepper/manufactured_discrete_gradient.py
              PYTHONPATH=/work python3 /work/engineering/timestepper/full_unforced_step.py
            '
